<!DOCTYPE html>
<html>
<head>
    <title>Expense Tracker</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            padding: 40px;
        }

        .container {
            width: 400px;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
        }

        .balance {
            text-align: center;
            background: #2196f3;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 7px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 6px;
            background: #2196f3;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #1976d2;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f5f5f5;
            padding: 12px;
            margin: 8px 0;
            border-radius: 6px;
        }

        .delete {
            width: auto;
            margin: 0;
            padding: 5px 10px;
            background: red;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>💰 Expense Tracker</h1>

        <div class="balance">
            <h3>Total Expenses</h3>
            <h2>₹<span id="total">0</span></h2>
        </div>

        <input type="text" id="name" placeholder="Expense name">

        <input type="number" id="amount" placeholder="Amount">

        <button onclick="addExpense()">Add Expense</button>

        <h3>Expense List</h3>

        <ul id="expenseList"></ul>

    </div>


    <script>

        let total = 0;

        function addExpense() {

            let name = document.getElementById("name").value;
            let amount = Number(document.getElementById("amount").value);

            if (name === "" || amount <= 0) {
                alert("Please enter valid details!");
                return;
            }

            total = total + amount;

            document.getElementById("total").innerText = total;


            let li = document.createElement("li");

            li.innerHTML = `
                <span>${name} - ₹${amount}</span>
                <button class="delete" onclick="deleteExpense(this, ${amount})">
                    Delete
                </button>
            `;


            document.getElementById("expenseList").appendChild(li);


            document.getElementById("name").value = "";
            document.getElementById("amount").value = "";
        }


        function deleteExpense(button, amount) {

            total = total - amount;

            document.getElementById("total").innerText = total;

            button.parentElement.remove();
        }

    </script>

</body>
